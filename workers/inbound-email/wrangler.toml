# Otto's inbound email Worker: mail for otto+<token>@track.ottosensei.com comes here, is turned into
# text and is posted to Otto, signed. Setup steps: README.md in this folder.
name = "otto-inbound-email"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# One Email Routing rule for otto@ takes every otto+<token>@ address once Subaddressing is on.
addresses = ["otto@track.ottosensei.com"]

[vars]
INBOUND_URL = "https://www.ottosensei.com/api/inbound/email"
INBOUND_DOMAINS = "track.ottosensei.com"
# The hourly interview run calls APP_URL/api/cron/interview-briefs.
APP_URL = "https://www.ottosensei.com"

# INBOUND_EMAIL_SECRET is a secret: wrangler secret put INBOUND_EMAIL_SECRET
# CRON_SECRET is a secret, the same value as on Vercel: wrangler secret put CRON_SECRET

# Minute 7 of every hour: the interview-morning briefs and "How did it go?" the morning after.
[triggers]
crons = ["7 * * * *"]

# No stored logs: they would hold who wrote to whom. Use "wrangler tail" to watch live.
[observability]
enabled = false

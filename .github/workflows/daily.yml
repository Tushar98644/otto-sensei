name: Daily

# Every scheduled job, once a day on GitHub's runner (owner decision 2026-11-23); Vercel runs no schedules.
# 1. Jobs: reads every due board here, writes straight to the database, rebuilds the match index and counts,
#    then asks the site to drop its cached /jobs pages (/api/cron/jobs-cache).
# 2. Title vectors: embeds the titles still waiting and sends them back (/api/cron/title-vectors).
# 3. The light daily jobs, one call each to the site: cleanup, job matches, career check-ins, view alerts,
#    trial reminders, follow-ups and the interview briefs' safety net (the Cloudflare worker runs those hourly).
# 4. IndexNow: tells Bing and the other IndexNow engines which sitemap URLs changed.
# Each step goes on after a failure, and the run's summary lists every step's result. docs/setup.md 10e.
#
# Secrets (Settings > Secrets and variables > Actions): DATABASE_URL (Supabase's Transaction pooler URL),
# CRON_SECRET (the same value as on Vercel). Variable: OTTO_APP_URL, e.g. https://www.ottosensei.com

on:
  schedule:
    # 05:40 UTC daily. GitHub may start scheduled runs some minutes late.
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes the job read may take (a first read of new Workday sites needs more)
        default: "20"

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OTTO_APP_URL: ${{ vars.OTTO_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        continue-on-error: true

      - name: Jobs
        id: jobs
        continue-on-error: true
        timeout-minutes: 35
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MINUTES: ${{ inputs.minutes || '20' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL not set yet; skipping the job read."
            exit 0
          fi
          # I/O bound: 16 boards at a time, each host still at its own pace.
          bun scripts/jobs-ingest-ci.ts --workers 16 --minutes "$MINUTES"

      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/title-vectors.txt
      - run: pip install -r scripts/title-vectors.txt
        continue-on-error: true
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/jobbert
          # The model files are pinned in scripts/title-vectors.py; change this key with them.
          key: jobbert-v2-c684fd6-a480476
      - run: python scripts/title-vectors.py fetch ~/.cache/jobbert
        continue-on-error: true

      - name: Title vectors
        id: titles
        continue-on-error: true
        timeout-minutes: 20
        env:
          TITLE_VECTOR_THREADS: "2"
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$OTTO_APP_URL" ]; then
            echo "::notice::CRON_SECRET or OTTO_APP_URL not set yet; skipping."
            exit 0
          fi
          base="${OTTO_APP_URL%/}/api/cron/title-vectors"
          auth="Authorization: Bearer $CRON_SECRET"
          # 15 rounds of 2,000 a day: a large backlog clears over a few days.
          for round in $(seq 1 15); do
            curl -sS --fail --max-time 60 -H "$auth" "$base?limit=2000" -o waiting.json
            count=$(jq '.keys | length' waiting.json)
            echo "Round $round: $count titles waiting"
            [ "$count" = "0" ] && break
            python scripts/title-vectors.py embed ~/.cache/jobbert waiting.json vectors.json
            total=$(jq '.vectors | length' vectors.json)
            for start in $(seq 0 600 $((total - 1))); do
              jq -c "{vectors: .vectors[$start:$((start + 600))]}" vectors.json > part.json
              curl -sS --fail --max-time 120 -X POST -H "$auth" -H "Content-Type: application/json" \
                --data-binary @part.json "$base" -o /dev/null
            done
          done
          curl -sS --fail --max-time 300 -X POST -H "$auth" -H "Content-Type: application/json" \
            --data '{"vectors":[],"rebuild":true}' "$base"

      # Each route works within its own 45 s budget and its windows allow one run a day at any hour.
      - name: Cleanup
        id: cleanup
        continue-on-error: true
        run: bash .github/scripts/cron-call.sh cleanup
      - name: Job matches
        id: job_matches
        continue-on-error: true
        run: bash .github/scripts/cron-call.sh job-matches
      - name: Career check-ins
        id: career_checkins
        continue-on-error: true
        run: bash .github/scripts/cron-call.sh career-checkins
      - name: View alerts
        id: view_alerts
        continue-on-error: true
        run: bash .github/scripts/cron-call.sh view-alerts
      - name: Trial reminders
        id: trial_reminders
        continue-on-error: true
        run: bash .github/scripts/cron-call.sh trial-reminders
      - name: Follow-ups
        id: follow_ups
        continue-on-error: true
        run: bash .github/scripts/cron-call.sh follow-ups
      - name: Interview briefs
        id: interview_briefs
        continue-on-error: true
        run: bash .github/scripts/cron-call.sh interview-briefs

      - name: Last sent URLs
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-
      - name: IndexNow
        id: indexnow
        continue-on-error: true
        run: bun scripts/indexnow.ts --state .indexnow/state.json
      - name: Remember what was sent
        if: ${{ always() && hashFiles('.indexnow/state.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}

      - name: Summary
        if: ${{ always() }}
        env:
          RESULTS: |
            Jobs|${{ steps.jobs.outcome }}
            Title vectors|${{ steps.titles.outcome }}
            Cleanup|${{ steps.cleanup.outcome }}
            Job matches|${{ steps.job_matches.outcome }}
            Career check-ins|${{ steps.career_checkins.outcome }}
            View alerts|${{ steps.view_alerts.outcome }}
            Trial reminders|${{ steps.trial_reminders.outcome }}
            Follow-ups|${{ steps.follow_ups.outcome }}
            Interview briefs|${{ steps.interview_briefs.outcome }}
            IndexNow|${{ steps.indexnow.outcome }}
        run: |
          {
            echo "| Step | Result |"
            echo "|---|---|"
            while IFS='|' read -r step result; do
              [ -n "$step" ] && echo "| $step | ${result:-not run} |"
            done <<< "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

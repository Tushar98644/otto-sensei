name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('bun.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('bun.lock', 'tsconfig.json') }}-
      # Route types and their validator, so tsc also checks what next build would.
      - run: bunx next typegen
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs') }}-
      - run: bun run lint
      - name: Unused files and dependencies
        if: ${{ !cancelled() }}
        run: bunx knip@6.45.1 --include files,dependencies,unlisted

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test

  # Browser tests against next dev on port 3100 with dev sign-in, mock billing, demo AI and a fresh local database.
  # Vercel builds every push, so instead of a second next build this analyzes the bundles and budgets each page's JS.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bash scripts/bundle-check.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bundle-routes
          path: .next/diagnostics/bundle-routes.json
          if-no-files-found: ignore
          retention-days: 14

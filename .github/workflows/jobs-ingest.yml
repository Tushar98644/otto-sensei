name: Daily jobs

# Reads every company board and feed once a day by calling the site's own job read, which saves
# board by board and picks up where the last call stopped. One call runs up to 4 minutes (the
# Vercel limit), so this keeps calling until a run reports it read everything, or 8 calls (about
# half an hour) have passed. No database credentials live here: only CRON_SECRET, the same value
# as on Vercel. "Run workflow" on the Actions tab fills it by hand.
#
# Secret (Settings > Secrets and variables > Actions): CRON_SECRET
# Variable: OTTO_APP_URL, the site's address, e.g. https://www.ottosensei.com

on:
  schedule:
    # 05:40 UTC daily. GitHub may start scheduled runs some minutes late; fine for a daily read.
    - cron: "40 5 * * *"
  workflow_dispatch:

# Never two reads at once: a manual run waits for the scheduled one, and the other way round.
concurrency:
  group: jobs-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read every board
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OTTO_APP_URL: ${{ vars.OTTO_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$OTTO_APP_URL" ]; then
            echo "::notice::CRON_SECRET or OTTO_APP_URL not set yet; skipping (see SETUP.md 10e)."
            exit 0
          fi
          base="${OTTO_APP_URL%/}"
          for call in 1 2 3 4 5 6 7 8; do
            status=$(curl -sS -o body.json -w '%{http_code}' --max-time 320 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$base/api/cron/jobs" || echo 000)
            complete=$(jq -r '.complete // false' body.json 2>/dev/null || echo false)
            echo "Call $call: HTTP $status, complete=$complete, $(jq -c '.stats // {}' body.json 2>/dev/null)"
            if [ "$status" = "401" ]; then
              echo "::error::The site refused CRON_SECRET. Use the same value as on Vercel."
              exit 1
            fi
            # A 500 means one step failed (a feed timing out, say); the next call carries on.
            if [ "$status" = "200" ] && [ "$complete" = "true" ]; then
              echo "Every board was read."
              exit 0
            fi
          done
          echo "::warning::Stopped after 8 calls with boards left; tomorrow's run continues."

  # Job matching v2 (MATCHING.md): every job title the day's read added gets its JobBERT-v2 vector here,
  # on GitHub's runner, never on the site. The site lists the titles still waiting and takes the
  # vectors back (CRON_SECRET again, no database credentials); the last call rebuilds the match index.
  titles:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/title-vectors.txt
      - run: pip install -r scripts/title-vectors.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/jobbert
          # The model files are pinned in scripts/title-vectors.py; change this key with them.
          key: jobbert-v2-c684fd6-a480476
      - run: python scripts/title-vectors.py fetch ~/.cache/jobbert
      - name: Embed the titles waiting
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OTTO_APP_URL: ${{ vars.OTTO_APP_URL }}
          TITLE_VECTOR_THREADS: "2"
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$OTTO_APP_URL" ]; then
            echo "::notice::CRON_SECRET or OTTO_APP_URL not set yet; skipping."
            exit 0
          fi
          base="${OTTO_APP_URL%/}/api/cron/title-vectors"
          auth="Authorization: Bearer $CRON_SECRET"
          # 15 rounds of 2,000 a day: the first backlog (about 58,000 titles) clears in two days.
          for round in $(seq 1 15); do
            curl -sS --fail --max-time 60 -H "$auth" "$base?limit=2000" -o waiting.json
            count=$(jq '.keys | length' waiting.json)
            echo "Round $round: $count titles waiting"
            [ "$count" = "0" ] && break
            python scripts/title-vectors.py embed ~/.cache/jobbert waiting.json vectors.json
            total=$(jq '.vectors | length' vectors.json)
            for start in $(seq 0 600 $((total - 1))); do
              jq -c "{vectors: .vectors[$start:$((start + 600))]}" vectors.json > part.json
              curl -sS --fail --max-time 120 -X POST -H "$auth" -H "Content-Type: application/json" \
                --data-binary @part.json "$base" -o /dev/null
            done
          done
          curl -sS --fail --max-time 300 -X POST -H "$auth" -H "Content-Type: application/json" \
            --data '{"vectors":[],"rebuild":true}' "$base"

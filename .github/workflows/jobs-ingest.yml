name: Daily jobs

# Reads every company board and feed once a day by calling the site's own job read, which saves
# board by board and picks up where the last call stopped. One call runs up to 4 minutes (the
# Vercel limit), so this keeps calling until a run reports it read everything, or 8 calls (about
# half an hour) have passed. No database credentials live here: only CRON_SECRET, the same value
# as on Vercel. "Run workflow" on the Actions tab fills it by hand.
#
# Secret (Settings > Secrets and variables > Actions): CRON_SECRET
# Variable: OTTO_APP_URL, the site's address, e.g. https://www.ottosensei.com

on:
  schedule:
    # 05:40 UTC daily. GitHub may start scheduled runs some minutes late; fine for a daily read.
    - cron: "40 5 * * *"
  workflow_dispatch:

# Never two reads at once: a manual run waits for the scheduled one, and the other way round.
concurrency:
  group: jobs-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read every board
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OTTO_APP_URL: ${{ vars.OTTO_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$OTTO_APP_URL" ]; then
            echo "::notice::CRON_SECRET or OTTO_APP_URL not set yet; skipping (see SETUP.md 10e)."
            exit 0
          fi
          base="${OTTO_APP_URL%/}"
          for call in 1 2 3 4 5 6 7 8; do
            status=$(curl -sS -o body.json -w '%{http_code}' --max-time 320 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$base/api/cron/jobs" || echo 000)
            complete=$(jq -r '.complete // false' body.json 2>/dev/null || echo false)
            echo "Call $call: HTTP $status, complete=$complete, $(jq -c '.stats // {}' body.json 2>/dev/null)"
            if [ "$status" = "401" ]; then
              echo "::error::The site refused CRON_SECRET. Use the same value as on Vercel."
              exit 1
            fi
            # A 500 means one step failed (a feed timing out, say); the next call carries on.
            if [ "$status" = "200" ] && [ "$complete" = "true" ]; then
              echo "Every board was read."
              exit 0
            fi
          done
          echo "::warning::Stopped after 8 calls with boards left; tomorrow's run continues."

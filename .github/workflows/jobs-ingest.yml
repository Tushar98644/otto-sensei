name: Daily jobs

# Reads every company board and feed into the production database once a day, then clears the
# site's cached /jobs pages. Runs here instead of a Vercel cron because a Vercel run stops at 4
# minutes, about half the boards. "Run workflow" on the Actions tab fills it by hand.
#
# Secrets (Settings > Secrets and variables > Actions):
#   POSTGRES_URL   Supabase's pooled connection string (the same value as on Vercel)
#   CRON_SECRET    the same value as on Vercel
# Variable:
#   OTTO_APP_URL   the site's address, e.g. https://ottosensei.com

on:
  schedule:
    # 05:40 UTC daily. GitHub may start scheduled runs some minutes late; fine for a daily read.
    - cron: "40 5 * * *"
  workflow_dispatch:

# Never two reads at once: a manual run waits for the scheduled one, and the other way round.
concurrency:
  group: jobs-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - run: bun install --frozen-lockfile
      # Until the secrets are added, a scheduled run says so and passes instead of failing every day.
      - run: |
          if [ -z "$POSTGRES_URL" ]; then
            echo "::notice::POSTGRES_URL secret not set yet; skipping the job read (see SETUP.md 10e)."
            exit 0
          fi
          bun scripts/jobs-ingest-ci.ts --minutes 45
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OTTO_APP_URL: ${{ vars.OTTO_APP_URL }}

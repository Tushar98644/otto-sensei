name: Title vectors
# Job matching v2 (MATCHING.md): every job title the day's read added gets its JobBERT-v2 vector here,
# on GitHub's runner, never on the site. The Vercel crons read the boards between 05:45 and 08:15 UTC;
# this then asks /api/cron/title-vectors for the titles still waiting and sends the vectors back
# (CRON_SECRET, no database credentials), and the last call rebuilds the match index.
# It is the only scheduled workflow besides IndexNow; "Run workflow" on the Actions tab runs it by hand.
#
# Secret (Settings > Secrets and variables > Actions): CRON_SECRET, the same value as on Vercel
# Variable: OTTO_APP_URL, the site's address, e.g. https://www.ottosensei.com

on:
  schedule:
    # 08:45 UTC daily, after the last job read. GitHub may start scheduled runs some minutes late.
    - cron: "45 8 * * *"
  workflow_dispatch:

concurrency:
  group: title-vectors
  cancel-in-progress: false

jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/title-vectors.txt
      - run: pip install -r scripts/title-vectors.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jobbert
          # The model files are pinned in scripts/title-vectors.py; change this key with them.
          key: jobbert-v2-c684fd6-a480476
      - run: python scripts/title-vectors.py fetch ~/.cache/jobbert
      - name: Embed the titles waiting
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OTTO_APP_URL: ${{ vars.OTTO_APP_URL }}
          TITLE_VECTOR_THREADS: "2"
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$OTTO_APP_URL" ]; then
            echo "::notice::CRON_SECRET or OTTO_APP_URL not set yet; skipping."
            exit 0
          fi
          base="${OTTO_APP_URL%/}/api/cron/title-vectors"
          auth="Authorization: Bearer $CRON_SECRET"
          # 15 rounds of 2,000 a day: the first backlog (about 58,000 titles) clears in two days.
          for round in $(seq 1 15); do
            curl -sS --fail --max-time 60 -H "$auth" "$base?limit=2000" -o waiting.json
            count=$(jq '.keys | length' waiting.json)
            echo "Round $round: $count titles waiting"
            [ "$count" = "0" ] && break
            python scripts/title-vectors.py embed ~/.cache/jobbert waiting.json vectors.json
            total=$(jq '.vectors | length' vectors.json)
            for start in $(seq 0 600 $((total - 1))); do
              jq -c "{vectors: .vectors[$start:$((start + 600))]}" vectors.json > part.json
              curl -sS --fail --max-time 120 -X POST -H "$auth" -H "Content-Type: application/json" \
                --data-binary @part.json "$base" -o /dev/null
            done
          done
          curl -sS --fail --max-time 300 -X POST -H "$auth" -H "Content-Type: application/json" \
            --data '{"vectors":[],"rebuild":true}' "$base"

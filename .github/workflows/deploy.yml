name: Deploy

# Off until the repository variable DEPLOY_FROM_CI is 'true'; SETUP.md 11b has the switch-over.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  production:
    # Pull request runs from a branch called main match the branch filter too, so only pushes count.
    if: >-
      vars.DEPLOY_FROM_CI == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One production deploy at a time; a newer one waiting replaces an older one waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Still the newest code on main
        id: newest
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::warning::$SHA is no longer on main, so it isn't deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          # CI skips pushes that only change Markdown, so only newer code means a newer deploy is coming.
          elif [ -n "$(git diff --name-only "$SHA" origin/main -- . ':(exclude)*.md')" ]; then
            echo "::notice::main has newer code than $SHA; its own CI run deploys that."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration lint passed on this commit
        if: steps.newest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 20); do
            runs=$(gh run list --workflow migrations.yml --commit "$SHA" --event push --json status,conclusion)
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" = 0 ]; then
              if [ "$(jq '[.[] | select(.conclusion != "success")] | length' <<<"$runs")" != 0 ]; then
                echo "::error::The Migrations workflow failed on $SHA, so it isn't deployed."
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "::error::The Migrations workflow on $SHA was still running after 10 minutes."
          exit 1

      - uses: actions/setup-node@v4
        if: steps.newest.outputs.deploy == 'true'
        with:
          node-version: 24

      - name: Deploy this commit to production
        if: steps.newest.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::DEPLOY_FROM_CI is on, but VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID isn't set (SETUP.md 11b)."
            exit 1
          fi
          npm install --global vercel@65.12.1
          # The CLI reads the branch from the checkout, and a detached HEAD has none.
          git checkout -B main
          vercel deploy --prod --yes --meta githubDeployment=1 --meta githubCommitRef=main > "$RUNNER_TEMP/deployment-url"
          echo "Deployed ${SHA:0:7} to production: $(cat "$RUNNER_TEMP/deployment-url")" >> "$GITHUB_STEP_SUMMARY"

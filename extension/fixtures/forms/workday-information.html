<!-- Workday apply step "My Information", hand-built from Workday's markup (data-automation-id names as on myworkdayjobs.com, 2026-11): its apply steps sit behind a candidate account, so no public page can be saved. -->
<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><title>Senior Security Engineer : NVIDIA</title></head>
<body>
<div data-automation-id="applyFlowPage">
  <div data-automation-id="progressBar"><ol>
    <li data-automation-id="progressBarCompletedStep"><label>Create Account/Sign In</label></li>
    <li data-automation-id="progressBarActiveStep"><div>current step 2 of 7</div><label>My Information</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>My Experience</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Application Questions</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Voluntary Disclosures</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Self Identify</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Review</label></li>
  </ol></div>
  <div data-automation-id="contactInformationPage">
    <h2>My Information</h2>
    <div data-automation-id="formField-source">
      <label for="source--source">How Did You Hear About Us?<abbr title="required">*</abbr></label>
      <div data-automation-id="multiselectInputContainer"><input type="text" id="source--source" data-automation-id="searchBox" placeholder="Search" aria-required="true" role="combobox"></div>
    </div>
    <fieldset data-automation-id="formField-candidateIsPreviousWorker">
      <legend>Have you previously worked for NVIDIA?<abbr title="required">*</abbr></legend>
      <div><input type="radio" id="previousWorker-yes" name="candidateIsPreviousWorker" value="true"><label for="previousWorker-yes">Yes</label></div>
      <div><input type="radio" id="previousWorker-no" name="candidateIsPreviousWorker" value="false"><label for="previousWorker-no">No</label></div>
    </fieldset>
    <div data-automation-id="formField-country">
      <label for="country--country">Country<abbr title="required">*</abbr></label>
      <button type="button" id="country--country" data-automation-id="countryDropdown" aria-haspopup="listbox" aria-required="true">Select One</button>
    </div>
    <div data-automation-id="formField-legalNameSection_firstName">
      <label for="name--legalName--firstName">First Name<abbr title="required">*</abbr></label>
      <input type="text" id="name--legalName--firstName" data-automation-id="legalNameSection_firstName" aria-required="true">
    </div>
    <div data-automation-id="formField-legalNameSection_middleName">
      <label for="name--legalName--middleName">Middle Name</label>
      <input type="text" id="name--legalName--middleName" data-automation-id="legalNameSection_middleName">
    </div>
    <div data-automation-id="formField-legalNameSection_lastName">
      <label for="name--legalName--lastName">Last Name<abbr title="required">*</abbr></label>
      <input type="text" id="name--legalName--lastName" data-automation-id="legalNameSection_lastName" aria-required="true">
    </div>
    <div data-automation-id="formField-addressSection_addressLine1">
      <label for="address--addressLine1">Address Line 1<abbr title="required">*</abbr></label>
      <input type="text" id="address--addressLine1" data-automation-id="addressSection_addressLine1" aria-required="true">
    </div>
    <div data-automation-id="formField-addressSection_city">
      <label for="address--city">City<abbr title="required">*</abbr></label>
      <input type="text" id="address--city" data-automation-id="addressSection_city" aria-required="true">
    </div>
    <div data-automation-id="formField-addressSection_postalCode">
      <label for="address--postalCode">Postal Code</label>
      <input type="text" id="address--postalCode" data-automation-id="addressSection_postalCode">
    </div>
    <div data-automation-id="formField-email">
      <label for="emailAddress--emailAddress">Email Address<abbr title="required">*</abbr></label>
      <input type="text" id="emailAddress--emailAddress" data-automation-id="email" aria-required="true">
    </div>
    <div data-automation-id="formField-phone-device-type">
      <label for="phoneNumber--phoneType">Phone Device Type<abbr title="required">*</abbr></label>
      <button type="button" id="phoneNumber--phoneType" data-automation-id="phone-device-type" aria-haspopup="listbox">Select One</button>
    </div>
    <div data-automation-id="formField-phone-number">
      <label for="phoneNumber--phoneNumber">Phone Number<abbr title="required">*</abbr></label>
      <input type="text" id="phoneNumber--phoneNumber" data-automation-id="phone-number" aria-required="true">
    </div>
  </div>
</div>
<div data-automation-id="pageFooter"><button type="button" data-automation-id="bottom-navigation-back-button">Back</button><button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button></div>
</body></html>

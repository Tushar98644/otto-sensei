<!-- Workday apply step "My Experience" after Add was pressed once under Work Experience, Education and Websites, hand-built from Workday's markup (data-automation-id names as on myworkdayjobs.com, 2026-11). -->
<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><title>Senior Security Engineer : NVIDIA</title></head>
<body>
<div data-automation-id="applyFlowPage">
  <div data-automation-id="progressBar"><ol>
    <li data-automation-id="progressBarActiveStep"><div>current step 3 of 7</div><label>My Experience</label></li>
  </ol></div>
  <div data-automation-id="myExperiencePage">
    <h2>My Experience</h2>
    <div data-automation-id="workExperienceSection">
      <h3>Work Experience</h3>
      <div data-automation-id="workExperience-1">
        <h4>Work Experience 1</h4>
        <div data-automation-id="formField-jobTitle"><label for="workExperience-1--jobTitle">Job Title<abbr title="required">*</abbr></label><input type="text" id="workExperience-1--jobTitle" data-automation-id="jobTitle" aria-required="true"></div>
        <div data-automation-id="formField-companyName"><label for="workExperience-1--companyName">Company<abbr title="required">*</abbr></label><input type="text" id="workExperience-1--companyName" data-automation-id="company" aria-required="true"></div>
        <div data-automation-id="formField-location"><label for="workExperience-1--location">Location</label><input type="text" id="workExperience-1--location" data-automation-id="location"></div>
        <div data-automation-id="formField-currentlyWorkHere"><input type="checkbox" id="workExperience-1--currentlyWorkHere" data-automation-id="currentlyWorkHere"><label for="workExperience-1--currentlyWorkHere">I currently work here</label></div>
        <div data-automation-id="formField-startDate"><label>From<abbr title="required">*</abbr></label>
          <input type="text" id="workExperience-1--startDate-dateSectionMonth-input" data-automation-id="dateSectionMonth-input" aria-label="Month" placeholder="MM" aria-required="true">
          <input type="text" id="workExperience-1--startDate-dateSectionYear-input" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY" aria-required="true">
        </div>
        <div data-automation-id="formField-endDate"><label>To</label>
          <input type="text" id="workExperience-1--endDate-dateSectionMonth-input" data-automation-id="dateSectionMonth-input" aria-label="Month" placeholder="MM">
          <input type="text" id="workExperience-1--endDate-dateSectionYear-input" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY">
        </div>
        <div data-automation-id="formField-roleDescription"><label for="workExperience-1--roleDescription">Role Description</label><textarea id="workExperience-1--roleDescription" data-automation-id="description"></textarea></div>
      </div>
      <button type="button" data-automation-id="Add" aria-label="Add Another Work Experience">Add Another</button>
    </div>
    <div data-automation-id="educationSection">
      <h3>Education</h3>
      <div data-automation-id="education-1">
        <h4>Education 1</h4>
        <div data-automation-id="formField-schoolName"><label for="education-1--schoolName">School or University<abbr title="required">*</abbr></label><input type="text" id="education-1--schoolName" data-automation-id="school" aria-required="true"></div>
        <div data-automation-id="formField-degree"><label for="education-1--degree">Degree<abbr title="required">*</abbr></label><button type="button" id="education-1--degree" data-automation-id="degree" aria-haspopup="listbox" aria-required="true">Select One</button></div>
        <div data-automation-id="formField-fieldOfStudy"><label for="education-1--fieldOfStudy">Field of Study</label><div data-automation-id="multiselectInputContainer"><input type="text" id="education-1--fieldOfStudy" data-automation-id="searchBox" placeholder="Search" role="combobox"></div></div>
        <div data-automation-id="formField-lastYearAttended"><label>To (Actual or Expected)</label><input type="text" id="education-1--lastYearAttended-dateSectionYear-input" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY"></div>
      </div>
      <button type="button" data-automation-id="Add" aria-label="Add Another Education">Add Another</button>
    </div>
    <div data-automation-id="resumeSection">
      <h3>Resume/CV</h3>
      <div data-automation-id="formField-resumeUpload"><label for="resumeAttachments--attachments">Upload a file (5MB max)</label>
        <div data-automation-id="attachments-FileUpload"><input type="file" id="resumeAttachments--attachments" data-automation-id="file-upload-input-ref" accept=".pdf,.doc,.docx"><button type="button" data-automation-id="select-files">Select files</button></div>
      </div>
    </div>
    <div data-automation-id="websiteSection">
      <h3>Websites</h3>
      <div data-automation-id="webAddress-1">
        <h4>Websites 1</h4>
        <div data-automation-id="formField-url"><label for="webAddress-1--url">URL<abbr title="required">*</abbr></label><input type="text" id="webAddress-1--url" data-automation-id="website" aria-required="true"></div>
      </div>
      <button type="button" data-automation-id="Add" aria-label="Add Another Websites">Add Another</button>
    </div>
    <div data-automation-id="formField-linkedinQuestion"><label for="socialNetworkAccounts--linkedInAccount">LinkedIn</label><input type="text" id="socialNetworkAccounts--linkedInAccount" data-automation-id="linkedinQuestion"></div>
  </div>
</div>
<div data-automation-id="pageFooter"><button type="button" data-automation-id="bottom-navigation-back-button">Back</button><button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button></div>
</body></html>
